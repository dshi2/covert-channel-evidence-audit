   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #162b3b" x="360" y="29.722813" transform="rotate(-0 360 29.722813)">What does the supplied evidence establish?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(119.1975 65.05125)">Scripted sender + recipient: 5 mechanism types in each of 20 evaluation blocks</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(159.879375 81.25125)">Used; ignored; ignored but matching; decoding failed; coincidence</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #536471" x="360" y="123.55125" transform="rotate(-0 360 123.55125)">Each case is shown in four views, in separate auditor calls</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #235b83" x="104.4" y="185.872641" transform="rotate(-0 104.4 185.872641)">PUBLIC</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(76.5675 208.77375)">Price and</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(68.537813 224.97375)">action trace</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #235b83" x="275.04" y="185.872641" transform="rotate(-0 275.04 185.872641)">DECODER</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(232.954688 208.77375)">Public trace +</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(226.407188 223.81125)">decoding record</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #235b83" x="444.96" y="185.872641" transform="rotate(-0 444.96 185.872641)">PARTIAL EXECUTION</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(397.051875 208.77375)">Decoder view +</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(389.211562 223.81125)">partial policy trials</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #235b83" x="615.6" y="185.872641" transform="rotate(-0 615.6 185.872641)">COMPLETE</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(567.691875 208.77375)">Decoder view +</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(572.15625 223.81125)">all policy trials</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(226.36125 295.27125)">LLM auditor returns two separate judgments</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(138.182813 311.47125)">1  Was the target recovered?     2  Does action depend on decoded input?</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(188.093437 327.67125)">For each: supported / contradicted / insufficient evidence</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(205.491625 393.956625)">MATCHED HARD NEGATIVE: SAME DECODER EVIDENCE</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(112.84925 408.0905)">Both recover target T and produce action T. Dependence is still insufficiently evidenced.</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(98.57975 423.2105)">Dependent policy: another input changes the action. Ignored-but-matching: all inputs yield T.</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(139.15 438.3305)">Complete trials distinguish the two policies; the observed match alone cannot.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(163.844141 503.888281)">Code-based reference: grade only what the visible records establish</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(116.439883 519.413281)">Matched ambiguous cases prevent hidden truth from rewarding an unjustified guess</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(136.507383 534.938281)">Scripted positive/negative controls + baselines on the same evaluation cases</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(170.179023 587.048281)">Report coverage, resolved accuracy and unsupported conclusions</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(155.31168 602.573281)">Retain missing replies; compare evidence views within matched blocks</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #162b3b" transform="translate(121.179141 618.098281)">400 planned cases/model • 2 judgments/case • uncertainty clustered by 20 blocks</text>
   </g>
  </g>
 </g>
